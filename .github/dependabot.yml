# Weekly dependency updates, one grouped pull request per ecosystem. A dependency change that
# alters what the binary bundles fails CI until packaging/third-party/components.tsv and
# THIRD-PARTY-NOTICES are updated (packaging/third-party-notices.sh).
#
# Not covered here, bump by hand: the GraalVM, Liberica NIK, wingetcreate and
# cyclonedx-maven-plugin versions pinned inside .github/workflows/release.yml.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # a new release waits a week first, so a compromised one is likely caught before it lands here
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
