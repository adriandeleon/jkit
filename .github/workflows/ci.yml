name: CI

# Builds and tests every pull request and every push to main on Linux, macOS and Windows, on the
# JVM (the native binary is built by release.yml). Linux also checks that THIRD-PARTY-NOTICES
# matches the libraries the binary bundles, and dry-runs the packaging scripts. The workflows job
# lints the workflow files, and the version job checks main's version is ahead of the latest
# release. release.yml's dry run, which builds the native binaries and the
# packages and smoke-tests them, runs on every push to main and on pull requests that change the
# build or the packaging.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the workflows
        # the Go module proxy checks the download against sum.golang.org. Shell scripts aren't
        # linted: shellcheck can't see through ${{ }}, and the scripts split words on purpose
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes=

  version:
    # main's version must be ahead of the latest release: a build from main that says 0.4.0-SNAPSHOT
    # after v0.4.0 is "older" than 0.4.0, and self-update would replace it with 0.4.0. After a
    # release, bump the version in every pom.xml (e.g. 0.5.0-SNAPSHOT) and this passes again.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version is ahead of the latest release
        run: |
          set -euo pipefail
          pom=$(sed -n 's:^  <version>\(.*\)</version>$:\1:p' pom.xml | head -1)
          base=${pom%-SNAPSHOT}
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::pom.xml version '$pom' is not x.y.z-SNAPSHOT"; exit 1; }
          # releases only: a pre-release tag (v0.5.0-rc.1) of the next version is fine
          # a repository with no release tags yet (a fork) has nothing to compare with
          latest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's:.*refs/tags/v::' \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          echo "pom.xml: $pom, latest release: ${latest:-none}"
          # the release commit itself still says X.Y.Z-SNAPSHOT (releases take the version from the
          # tag), so a run on the commit the latest tag points at is fine
          if [ -n "$latest" ]; then
            tagged=$(git ls-remote --tags origin "refs/tags/v$latest" "refs/tags/v$latest^{}" | awk '{print $1}')
            if grep -qx "$(git rev-parse HEAD)" <<<"$tagged"; then
              echo "this is the v$latest release commit"
              exit 0
            fi
          fi
          newest=$(printf '%s\n%s\n' "$latest" "$base" | sort -V | tail -1)
          if [ -n "$latest" ] && { [ "$newest" != "$base" ] || [ "$latest" = "$base" ]; }; then
            echo "::error::pom.xml says $pom but v$latest is released: bump every pom.xml past $latest (e.g. to the next minor -SNAPSHOT)"
            exit 1
          fi

  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      # The hook lint steps check the recorded hooks in hooks-golden/: the templates rendered for
      # sample paths, which HooksGoldenTest (in Build and test) keeps equal to what jkit prints.
      # root0-self1 has plain paths; the other recordings put quotes and $ in them on purpose.
      - name: Lint the bash hook
        if: runner.os == 'Linux'
        run: |
          shellcheck --version
          g=jkit-platform/src/test/resources/dev/jkit/platform/hooks-golden
          cat "$g/bash-root0-self1.txt" "$g/auto-switch-bash.txt" > "$RUNNER_TEMP/hook.bash"
          shellcheck -s bash "$RUNNER_TEMP/hook.bash"

      - name: Parse the zsh hook
        # shellcheck has no zsh mode, and zsh comes with macOS; -n parses without running anything
        if: runner.os == 'macOS'
        run: |
          g=jkit-platform/src/test/resources/dev/jkit/platform/hooks-golden
          cat "$g/zsh-root0-self1.txt" "$g/auto-switch-zsh.txt" > "$RUNNER_TEMP/hook.zsh"
          zsh -n "$RUNNER_TEMP/hook.zsh"

      - name: Lint the PowerShell hook
        # fails on parse errors and on PSScriptAnalyzer's Error findings, and prints its warnings
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $hook = Get-Content -Raw jkit-platform/src/test/resources/dev/jkit/platform/hooks-golden/pwsh-root0-self1.txt
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($hook, [ref]$null, [ref]$errors)
          if ($errors) { $errors | Out-String | Write-Output; exit 1 }
          $found = @(Invoke-ScriptAnalyzer -ScriptDefinition $hook -Severity Warning, Error)
          $found | Format-Table -AutoSize -Wrap | Out-String -Width 200 | Write-Output
          if ($found | Where-Object Severity -eq 'Error') { exit 1 }

      - name: Check THIRD-PARTY-NOTICES
        if: runner.os == 'Linux'
        run: packaging/third-party-notices.sh --check

      - name: Check the release notes
        if: runner.os == 'Linux'
        run: packaging/release-notes.sh --check

      - name: Dry-run the packaging scripts
        if: runner.os == 'Linux'
        run: |
          for p in linux-x64 linux-aarch64 linux-x64-musl macos-aarch64 macos-x64; do
            echo "$(printf %064d 0)  jkit-1.2.3-$p.tar.gz"
          done > "$RUNNER_TEMP/SHA256SUMS"
          echo "$(printf %064d 0)  jkit-1.2.3-windows-x64.zip" >> "$RUNNER_TEMP/SHA256SUMS"
          packaging/homebrew-formula.sh 1.2.3 "$RUNNER_TEMP/SHA256SUMS" > /dev/null
          packaging/winget-manifests.sh 1.2.3 "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/manifests"
          if packaging/homebrew-formula.sh 'v1.2.3' "$RUNNER_TEMP/SHA256SUMS" > /dev/null 2>&1; then
            echo "::error::homebrew-formula.sh accepted an invalid version"
            exit 1
          fi
